<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CareerPilot</title>
<style>body{margin:0;background:#f4f6fa;color:#18243b;font:15px system-ui}header{background:#14263c;color:white;padding:25px 5%}main{max-width:1200px;margin:25px auto;padding:0 20px}button,a.button{background:#155e75;color:white;border:0;border-radius:6px;padding:10px 14px;cursor:pointer;text-decoration:none;display:inline-block;margin:3px}input,textarea,select{padding:10px;border:1px solid #cbd5e1;border-radius:5px;box-sizing:border-box}textarea{width:100%;min-height:160px;font:13px monospace}section,article{background:white;border:1px solid #dce3ed;border-radius:10px;padding:20px;margin-bottom:16px}small{color:#53667b}#list article{cursor:pointer}h2{font-size:20px}.tag{padding:4px 8px;border-radius:4px;background:#e6f0f4;display:inline-block;margin:3px}pre{white-space:pre-wrap;overflow-wrap:anywhere}dialog{width:min(900px,90vw);max-height:85vh;overflow-y:auto;border:1px solid #ccc;border-radius:12px}#notice{padding:12px;color:#155e75}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style>
<header><h1>CareerPilot</h1><p>Europe first. Your next opportunity, with evidence.</p></header><main>
<section><button onclick="scan()">Find jobs</button><button onclick="settings()">Verified profile & sources</button><button onclick="importJob()">Import any JD</button><input id="search" placeholder="Search company or role" oninput="render()"><select id="sponsor" onchange="render()"><option value="">All sponsorship statuses</option><option>explicitly offered</option><option>conditional / conflicting</option><option>not stated</option><option>explicitly unavailable</option></select><div id="notice">Add your verified profile before generating applications. No applications or messages are sent.</div></section><div id="list"></div>
<dialog id="modal"><button onclick="this.parentElement.close()">Close</button><div id="content"></div></dialog></main>
<script>
const TOKEN='__TOKEN__';let jobs=[];let active='';const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const link=u=>/^https:\/\//i.test(u)?esc(u):'#';
async function api(path,method='GET',body){let r=await fetch('/api/'+path,{method,headers:{'Content-Type':'application/json','X-CareerPilot-Token':TOKEN},body:body===undefined?undefined:JSON.stringify(body)});if(!r.ok){let message=await r.text();try{message=JSON.parse(message).detail||message}catch{}throw Error(message)}return r.json()}
function notice(s){document.getElementById('notice').textContent=s}
async function refresh(){jobs=await api('jobs');render()}
function render(){let q=document.getElementById('search').value.toLowerCase(),s=document.getElementById('sponsor').value;document.getElementById('list').innerHTML=jobs.filter(j=>(j.title+' '+j.company).toLowerCase().includes(q)&&(!s||j.assessment.sponsorship.status===s)).map(j=>`<article onclick="detail('${j.id}')"><small>${esc(j.assessment.region)} · ${esc(j.location)} · ${esc(j.stage)}</small><h2>${esc(j.title)}</h2><p>${esc(j.company)} <span class="tag">${esc(j.assessment.sponsorship.status)}</span><span class="tag">${j.assessment.fit_score}% skill overlap</span></p><small>${esc(j.status)}</small></article>`).join('')||'<section>No matching jobs yet. Configure sources, run a scan, or import a job description.</section>'}
function show(html){document.getElementById('content').innerHTML=html;if(!document.getElementById('modal').open)document.getElementById('modal').showModal();document.getElementById('modal').scrollTop=0}
async function scan(){notice('Scanning configured sources…');try{let r=await api('scan','POST');notice(`Collected ${r.matched} relevant records. Source errors: ${JSON.stringify(r.errors)}`);await refresh()}catch(e){notice(e.message)}}
async function settings(){let s=await api('settings');show(`<h2>Verified profile</h2><p>Include only confirmed facts. Each fact needs a unique ID.</p><textarea id="profile" style="height:280px">${esc(JSON.stringify(s.profile,null,2))}</textarea><h2>Job sources</h2><textarea id="sources">${esc(JSON.stringify(s.sources,null,2))}</textarea><button onclick="saveSettings()">Save</button>`)}
async function saveSettings(){try{await api('settings','PUT',{profile:JSON.parse(document.getElementById('profile').value),sources:JSON.parse(document.getElementById('sources').value)});notice('Profile and sources saved');document.getElementById('modal').close()}catch(e){alert(e.message)}}
function importJob(){show('<h2>Import a job description</h2><p>Use the employer’s official application URL when available.</p><input id="title" placeholder="Job title"><input id="company" placeholder="Company"><input id="location" placeholder="Country / location"><input id="url" placeholder="https:// employer apply URL" style="width:100%;margin:10px 0"><textarea id="jd" placeholder="Full job description"></textarea><button onclick="saveJob()">Add job</button>')}
async function saveJob(){try{await api('jobs','POST',{title:document.getElementById('title').value,company:document.getElementById('company').value,location:document.getElementById('location').value,apply_url:document.getElementById('url').value,description:document.getElementById('jd').value});document.getElementById('modal').close();await refresh()}catch(e){alert(e.message)}}
async function detail(id){
 active=id;let j=jobs.find(x=>x.id===id);
 show(`<h2>${esc(j.title)}</h2><p>${esc(j.company)} · ${esc(j.location)}</p>
 <a class="button" href="${link(j.apply_url)}" target="_blank" rel="noopener noreferrer">Employer / apply page</a>
 <button onclick="verify()">Check page</button><button id="prepare" onclick="generate()">Prepare CV + cover letter</button>
 <button onclick="quickProfile()">Set up CV profile</button>
 <select onchange="setStage(this.value)">${['shortlisted','prepared','applied','interview','rejected','closed'].map(s=>`<option ${j.stage===s?'selected':''}>${s}</option>`).join('')}</select>
 <div id="docs" role="status" aria-live="polite"></div>
 <section><h3>Full job description</h3><p>${j.description?.trim()?'Review or edit the saved description below.':'This source did not supply a description. Open the employer page, copy the JD, and save it below.'}</p>
 <textarea id="job-description" aria-label="Full job description" style="height:260px">${esc(j.description)}</textarea>
 <button onclick="saveJD()">Save job description</button><small id="jd-status"></small></section>
 <h3>Sponsorship evidence</h3><p>${esc(j.assessment.sponsorship.status)}</p>
 <pre>${esc(j.assessment.sponsorship.evidence.join('\n\n')||'No explicit sponsorship statement found.')}</pre>
 <p>${j.assessment.experience_review?'Review experience requirements. ':''}${j.assessment.language_review?'Review language requirements.':''}</p>
 <h3>Relevant contacts</h3><div id="contact-area">Loading contacts…</div>`);
 try{let c=await api(`jobs/${id}/contacts`);if(active!==id||!document.getElementById('contact-area'))return;
 document.getElementById('contact-area').innerHTML=c.queries.map(q=>`<p><a href="https://www.google.com/search?q=${encodeURIComponent(q)}" target="_blank" rel="noopener noreferrer">${esc(q)}</a></p>`).join('')+`<button onclick="contactSearch()">Research contacts with Brave</button><button onclick="addContact()">Save reviewed contact</button><pre id="leads">${esc(JSON.stringify(c.contacts,null,2))}</pre>`;
 }catch(e){document.getElementById('contact-area').textContent=e.message}
}
async function saveJD(){try{await api(`jobs/${active}/description`,'PUT',{description:document.getElementById('job-description').value});await refresh();document.getElementById('jd-status').textContent='Saved. You can now prepare your documents.';document.getElementById('docs').innerHTML=''}catch(e){document.getElementById('jd-status').textContent=e.message}}
async function quickProfile(){let settingsData=await api('settings');window.quickSettings=settingsData;let p=settingsData.profile;
 show(`<h2>Set up your CV profile</h2><p>Paste your real CV text. Facts are kept as written and reordered for the JD. Nothing is uploaded to GitHub.</p>
 <label>Name<input id="cv-name" style="width:100%" value="${esc(p.name==='Your name'?'':p.name)}"></label>
 <label>Email<input id="cv-email" style="width:100%" value="${esc(p.email==='you@example.com'?'':p.email)}"></label>
 <label>Professional headline<input id="cv-headline" style="width:100%" value="${esc(p.headline)}"></label>
 <label>Years of experience<input id="cv-years" type="number" min="0" value="${p.years_experience||6}"></label>
 <label>Skills, separated by commas<input id="cv-skills" style="width:100%" value="${esc((p.skills||[]).join(', '))}"></label>
 <label>CV text: separate roles and education entries with blank lines<textarea id="cv-text" style="height:300px">${esc((p.facts||[]).filter(f=>!f.text.startsWith('Replace with')).map(f=>f.text).join('\n\n'))}</textarea></label>
 <button onclick="saveQuickProfile()">Save CV profile</button><p id="profile-error" role="alert"></p>`)}
async function saveQuickProfile(){try{let name=document.getElementById('cv-name').value.trim(),text=document.getElementById('cv-text').value.trim();if(!name||!text)throw Error('Enter your name and paste your CV text.');let p={name,email:document.getElementById('cv-email').value.trim(),headline:document.getElementById('cv-headline').value.trim(),years_experience:Number(document.getElementById('cv-years').value),skills:document.getElementById('cv-skills').value.split(',').map(s=>s.trim()).filter(Boolean),facts:text.split(/\n\s*\n/).filter(Boolean).map((text,i)=>({id:'cv'+i,section:'Background',text}))};await api('settings','PUT',{profile:p,sources:window.quickSettings.sources});await refresh();if(active)await detail(active);else document.getElementById('modal').close();notice('CV profile saved. Select a job and prepare your documents.')}catch(e){document.getElementById('profile-error').textContent=e.message}}

async function verify(){try{let r=await api(`jobs/${active}/verify`,'POST');alert(r.status);await refresh()}catch(e){alert(e.message)}}
async function setStage(s){await api(`jobs/${active}`,'PATCH',{stage:s});await refresh()}
async function generate(){let id=active,box=document.getElementById('docs'),button=document.getElementById('prepare');box.textContent='Preparing verified facts…';box.scrollIntoView({block:'nearest'});button.disabled=true;
 try{let jd=document.getElementById('job-description').value.trim();if(!jd)throw Error('The job description is missing. Paste and save the full JD below first.');let saved=jobs.find(j=>j.id===id);if(jd!==saved.description){await api(`jobs/${id}/description`,'PUT',{description:jd});await refresh()}
 let d=await api(`jobs/${id}/documents`,'POST');if(active!==id||!document.getElementById('docs'))return;
 box.innerHTML=`<h3>Review your application package</h3><small>${esc(d.mode)}. ${esc(d.note)}</small><div class="grid"><div><h4>CV</h4><pre>${esc(d.cv)}</pre><a class="button" href="/api/jobs/${id}/documents/cv.pdf">Download CV PDF</a></div><div><h4>Cover letter</h4><pre>${esc(d.cover_letter)}</pre><a class="button" href="/api/jobs/${id}/documents/cover_letter.pdf">Download letter PDF</a></div></div>`;
 }catch(e){box.innerHTML=`<p role="alert" style="color:#b42318">${esc(e.message)}</p><button onclick="quickProfile()">Set up or correct CV profile</button>`}finally{button.disabled=false;box.scrollIntoView({block:'nearest'})}}

async function contactSearch(){try{let r=await api(`jobs/${active}/contacts/search`,'POST');document.getElementById('leads').textContent=JSON.stringify(r,null,2)}catch(e){alert(e.message)}}
async function addContact(){let name=prompt('Verified name');if(!name)return;let title=prompt('Role/title'),source_url=prompt('Public source URL'),email=prompt('Public professional email (optional)')||'';try{await api(`jobs/${active}/contacts`,'POST',{name,title,source_url,email});await detail(active)}catch(e){alert(e.message)}}
refresh().catch(e=>notice(e.message));
</script></html>
